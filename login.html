<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CyberSecurity</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="auth-form">
            <!-- Decorative floating shapes -->
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
            </div>

            <!-- Logo / Icon -->
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to CyberSecurity Platform</p>
            </div>

            <form id="loginForm">
                <!-- Username -->
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Username
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" id="toggleLoginPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader" id="btnLoader" style="display:none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>
            </form>

            <div id="message"></div>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html" class="auth-link">Create Account</a></p>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('toggleLoginPassword').addEventListener('click', function () {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Display message
        function displayMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = type;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = '';
            }, 5000);
        }

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                displayMessage('Please fill in all fields.', 'error');
                return;
            }

            const btn = document.getElementById('loginBtn');
            const btnText = btn.querySelector('.btn-text');
            const btnLoader = document.getElementById('btnLoader');
            btn.disabled = true;
            btnText.textContent = 'Signing In...';
            btnLoader.style.display = 'inline-block';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('login.php', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    displayMessage(result.message, 'success');
                    document.getElementById('loginForm').reset();
                    // Save username and redirect to dashboard
                    sessionStorage.setItem('loggedInUser', username);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html?user=' + encodeURIComponent(username);
                    }, 1000);
                } else {
                    displayMessage(result.message, 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                displayMessage('An error occurred. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Sign In';
                btnLoader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
