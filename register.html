<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CyberSecurity</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="auth-form register-form">
            <!-- Decorative floating shapes -->
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
            </div>

            <!-- Logo / Icon -->
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h2>Create Account</h2>
                <p class="auth-subtitle">Join CyberSecurity Platform</p>
            </div>

            <form id="registerForm" action="register.php" method="POST">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullname">
                        <i class="fas fa-user"></i>
                        Full Name
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                    </div>
                </div>



                <!-- Username -->
                <div class="form-group">
                    <label for="reg-username">
                        <i class="fas fa-at"></i>
                        Username
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="reg-username" name="username" placeholder="Choose a username" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="reg-password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="reg-password" name="password" placeholder="Create a strong password" required>
                        <button type="button" class="toggle-password" id="togglePassword" onclick="togglePasswordVisibility('reg-password', 'togglePassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <!-- Password Strength Bar -->
                    <div class="password-strength-container">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText"></span>
                    </div>

                    <!-- Password Requirements Checklist -->
                    <div class="password-checklist" id="passwordChecklist">
                        <div class="check-item" id="check-length">
                            <i class="fas fa-circle"></i>
                            <span>At least 12 characters</span>
                        </div>
                        <div class="check-item" id="check-upper">
                            <i class="fas fa-circle"></i>
                            <span>At least 1 uppercase letter (A-Z)</span>
                        </div>
                        <div class="check-item" id="check-lower">
                            <i class="fas fa-circle"></i>
                            <span>At least 1 lowercase letter (a-z)</span>
                        </div>
                        <div class="check-item" id="check-number">
                            <i class="fas fa-circle"></i>
                            <span>At least 1 number (0-9)</span>
                        </div>
                        <div class="check-item" id="check-special">
                            <i class="fas fa-circle"></i>
                            <span>At least 1 special character (!@#$%)</span>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm-password">
                        <i class="fas fa-lock"></i>
                        Confirm Password
                    </label>
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter your password" required>
                        <button type="button" class="toggle-password" id="toggleConfirmPassword" onclick="togglePasswordVisibility('confirm-password', 'toggleConfirmPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small class="match-message" id="matchMessage"></small>
                </div>

                <button type="submit" class="btn" id="registerBtn">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-loader" id="btnLoader" style="display:none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>
            </form>

            <div id="message"></div>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
